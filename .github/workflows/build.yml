name: Build ChronoVolume bundles
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Two separate macOS pools: if one is saturated, the other usually works.
        # Both produce a universal (Apple Silicon + Intel) bundle.
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoVolume-${{ matrix.os }}
          path: build/ChronoVolume.ofx.bundle
